<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2057" />
    <meta
      name="description"
      content="Command Center PIK"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Command Center PIK</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="app-boot-splash" role="status" aria-label="Memuat Command Center PIK">
        <img src="%PUBLIC_URL%/logo512.png" alt="Command Center PIK" />
        <div>COMMAND CENTER PIK</div>
        <span></span>
      </div>
    </div>
    <style>
      .app-boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0f2057; color: #fff; font: 700 14px Arial, sans-serif; letter-spacing: 1.5px; }
      .app-boot-splash img { width: min(34vw, 164px); height: min(34vw, 164px); object-fit: contain; border-radius: 24%; box-shadow: 0 18px 45px rgba(0,0,0,.24); }
      .app-boot-splash span { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
